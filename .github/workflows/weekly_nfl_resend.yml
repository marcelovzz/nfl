name: Weekly NFL Quant Simulations & Resend Report

on:
  schedule:
    # Jueves (Thursday Night Football): 22:30 UTC (~4:30 PM Monterrey/CDMX CST)
    - cron: '30 22 * * 4'
    # Domingos (15 min después de inactivos oficiales de las 10:30 AM CST): 16:45 UTC (10:45 AM CST)
    - cron: '45 16 * * 0'
    # Lunes (Monday Night Football): 22:30 UTC (~4:30 PM Monterrey/CDMX CST)
    - cron: '30 22 * * 1'
    # Martes (Auto-calibración post-MNF y registro en Audit_Log): 12:00 UTC (6:00 AM CST)
    - cron: '0 12 * * 2'
  workflow_dispatch:
    inputs:
      nfl_week:
        description: 'Semana NFL opcional (1-18). Si se deja vacío, se detecta automáticamente.'
        required: false
        default: ''
      mode:
        description: 'Modo de ejecución: send_briefing (default) o calibrate_post_slate'
        required: false
        default: 'send_briefing'

permissions:
  contents: write

jobs:
  run-nfl-quant-resend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Ubuntu system libraries for PDF & image rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0 libgdk-pixbuf-xlib-2.0-0 libffi-dev shared-mime-info

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync ESPN Injuries, Depth Charts, Inactives, Newly Activated & Open-Meteo Weather
        env:
          NFL_WEEK: ${{ github.event.inputs.nfl_week }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 12 * * 2" ] || [ "${{ github.event.inputs.mode }}" = "calibrate_post_slate" ]; then
            python sync_injuries_nfl.py --calibrate
          else
            python sync_injuries_nfl.py
          fi

      - name: Execute NFL Monte Carlo Simulations and Send Mobile Briefing + PDF via Resend
        if: ${{ github.event.schedule != '0 12 * * 2' && github.event.inputs.mode != 'calibrate_post_slate' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NFL_WEEK: ${{ github.event.inputs.nfl_week }}
        run: |
          python resend_nfl.py

      - name: Commit and Push Updated Starters, Injuries & Audit_Log to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_injuries_live.json nfl_starters_verified.json nfl_roster_moves.json nfl_stats1.xlsx || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(nfl): auto-sync injuries starters weather and Audit_Log"
            git pull --rebase origin main
            git push origin main
          fi
